# Demo-стенд: Postgres 16 + S3-совместимое хранилище (SeaweedFS).
# В проде S3 должен быть внешним (AWS S3 / другой провайдер, другой аккаунт) —
# иначе вместе с сервером умрут и бэкапы. Здесь SeaweedFS нужен для проверки скриптов.
name: laravel-backup

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # выполняется только при первом запуске на пустом томе
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  s3:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    logging: *default-logging
    # master + volume + filer + S3 gateway в одном процессе
    command: server -dir=/data -ip=s3 -s3 -s3.port=8333 -master.volumeSizeLimitMB=1024 -volume.max=100
    environment:
      # единственная (admin) S3-identity; бэкапным скриптам хватает её
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env}
    volumes:
      - s3data:/data
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  s3data:
